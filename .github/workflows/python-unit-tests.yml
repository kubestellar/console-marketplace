name: Python Unit Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/python-unit-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/python-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Validator Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.4 coverage==7.6.10 requests==2.32.3

      - name: Run tests with coverage
        run: |
          python -m coverage run --branch --source=scripts -m pytest tests/ -v

      - name: Check coverage threshold
        run: |
          python -m coverage report --fail-under=100 --include='scripts/validate-marketplace.py'
