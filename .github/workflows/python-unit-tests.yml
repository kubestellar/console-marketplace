name: Python Unit Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'conftest.py'
      - 'pytest.ini'
      - '.coveragerc'
      - '.github/workflows/python-unit-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'conftest.py'
      - 'pytest.ini'
      - '.coveragerc'
      - '.github/workflows/python-unit-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    name: Validator Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'

      - name: Run shell unit tests
        run: bash scripts/test_apply-branch-protection.sh

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run node unit tests with coverage
        # pytest does not collect tests/*.test.mjs, so this is the only CI job
        # that runs them. The pattern is quoted so node's own --test glob
        # expands it; a bare directory argument (`node --test tests/`) is
        # resolved as a module path and fails.
        #
        # Informational-only (no --fail-under gate): jscpd-ratchet.mjs's main()
        # CLI wiring is deliberately untested per #1057, so a 100% threshold
        # would permanently fail. The report still surfaces new untested code.
        run: node --experimental-test-coverage --test 'tests/**/*.test.mjs'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==9.0.3 coverage==7.6.10 requests==2.33.0

      - name: Run tests with coverage
        run: |
          python -m coverage run --branch --source=scripts -m pytest tests/ -v

      - name: Check coverage threshold
        run: |
          python -m coverage report --fail-under=100 --include='scripts/*.py,scripts/validate_marketplace_lib/*.py'
