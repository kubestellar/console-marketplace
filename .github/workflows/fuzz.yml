name: JSON Fuzzing

on:
  # Run weekly to satisfy Scorecard's Fuzzing check
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 03:00 UTC
  # Run on PRs to catch issues early
  pull_request:
    branches: ["main"]
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-json:
    name: Fuzz JSON Parsing
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install fuzzing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install atheris==2.3.0 jsonschema==4.23.0 pytest==8.3.4

      - name: Prepare fuzz target
        run: |
          # fuzz/fuzz_json_parser.py is committed to the repo (see #594) so it
          # is lintable, type-checkable, and unit-tested by
          # tests/fuzz/test_fuzz_json_parser.py. It was already fetched by
          # the checkout step above; just ensure it is executable.
          chmod +x fuzz/fuzz_json_parser.py

      - name: Run fuzzing tests
        id: run-fuzzing
        run: |
          cd fuzz
          # Run fuzzer for 60 seconds with timeout. `timeout` exits 124 when the
          # fuzzer is still running (and hasn't crashed) at the 60s deadline --
          # that is the expected/normal outcome and must not fail the step. Any
          # OTHER non-zero exit means Atheris found and reported a crash, which
          # must fail the step so the workflow-failure alert can fire instead of
          # being silently swallowed by an unconditional `|| true`.
          set +e
          timeout 60s python fuzz_json_parser.py -atheris_runs=100000
          FUZZ_EXIT=$?
          set -e
          if [ "$FUZZ_EXIT" -ne 0 ] && [ "$FUZZ_EXIT" -ne 124 ]; then
            echo "::error::Atheris fuzzing reported a crash (exit code $FUZZ_EXIT) -- see the log above for the traceback and reproducer input."
            exit "$FUZZ_EXIT"
          fi
          echo "status=pass" >> "$GITHUB_OUTPUT"

      - name: Fuzzing observability summary
        if: always()
        run: |
          python3 scripts/fuzz_summary.py --fuzzer-status "${{ steps.run-fuzzing.outputs.status || 'unknown' }}"
