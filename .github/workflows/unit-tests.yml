name: Unit Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '20'

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package.json ]; then
            if node -e "const s=require('./package.json').scripts||{}; process.exit(s.test?0:1)"; then
              npm test
              exit 0
            fi
          fi

          if [ -f web/package.json ]; then
            if node -e "const s=require('./web/package.json').scripts||{}; process.exit(s.test?0:1)"; then
              npm --prefix web test
              exit 0
            fi
          fi

          npx --yes vitest run --passWithNoTests
