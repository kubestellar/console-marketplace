name: TypeScript Unit Tests

on:
  pull_request:
    paths:
      - 'web/src/**'
      - 'vitest.marketplace.config.ts'
      - '.github/workflows/ts-unit-tests.yml'
  push:
    branches: [main]
    paths:
      - 'web/src/**'
      - 'vitest.marketplace.config.ts'
      - '.github/workflows/ts-unit-tests.yml'

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout marketplace
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout console (Vitest config and shared deps)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: kubestellar/console
          path: console-parent
          sparse-checkout: |
            web/package.json
            web/package-lock.json
            web/vite.config.ts
            web/tsconfig.json
            web/tsconfig.node.json
            web/src/test/setup.ts

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: console-parent/web
        run: npm ci

      - name: Link console node_modules for marketplace test resolution
        run: ln -s "${GITHUB_WORKSPACE}/console-parent/web/node_modules" "${GITHUB_WORKSPACE}/web/node_modules"

      - name: Run vitest with coverage gate
        working-directory: console-parent/web
        run: npx vitest run --config "${GITHUB_WORKSPACE}/vitest.marketplace.config.ts" --dir "${GITHUB_WORKSPACE}/web" --coverage
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
