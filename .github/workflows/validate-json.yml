name: Validate JSON

on:
  pull_request:
    paths:
      - 'registry.json'
      - 'dashboards/**/*.json'
      - 'presets/**/*.json'
      - 'card-presets/**/*.json'
      - 'themes/**/*.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate registry.json
        run: |
          echo "Validating registry.json..."
          python3 -m json.tool registry.json > /dev/null
          echo "registry.json is valid JSON"

      - name: Validate dashboard files
        run: |
          errors=0
          for f in dashboards/*/dashboard.json; do
            if [ -f "$f" ]; then
              if python3 -m json.tool "$f" > /dev/null 2>&1; then
                echo "OK: $f"
              else
                echo "INVALID: $f"
                errors=$((errors + 1))
              fi
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "Found $errors invalid JSON file(s)"
            exit 1
          fi

      - name: Validate dashboard format
        run: |
          python3 - <<'SCRIPT'
          import glob, json, os, re, sys

          errors = 0
          for path in glob.glob("dashboards/*/dashboard.json"):
              with open(path) as f:
                  data = json.load(f)

              if data.get("format") != "kc-dashboard-v1":
                  print(f"ERROR: {path} missing or wrong 'format' field (expected 'kc-dashboard-v1')")
                  errors += 1

              if not data.get("name"):
                  print(f"ERROR: {path} missing 'name' field")
                  errors += 1

              if not isinstance(data.get("cards"), list):
                  print(f"ERROR: {path} missing or invalid 'cards' array")
                  errors += 1
              else:
                  for i, card in enumerate(data["cards"]):
                      if not card.get("card_type"):
                          print(f"ERROR: {path} cards[{i}] missing 'card_type'")
                          errors += 1
                      if not isinstance(card.get("position"), dict):
                          print(f"ERROR: {path} cards[{i}] missing 'position'")
                          errors += 1

              print(f"OK: {path} ({len(data.get('cards', []))} cards)")

          # Validate registry entries across both items[] and presets[]
          with open("registry.json") as f:
              registry = json.load(f)

          registry_entries = registry.get("items", []) + registry.get("presets", [])
          seen_ids = set()

          for item in registry_entries:
              item_id = item.get("id")
              item_type = item.get("type")

              if item_id in seen_ids:
                  print(f"ERROR: duplicate registry id '{item_id}'")
                  errors += 1
              seen_ids.add(item_id)

              if item_type == "dashboard":
                  expected_paths = [f"dashboards/{item_id}/dashboard.json"]
              elif item_type == "card-preset":
                  expected_paths = [f"presets/{item_id}.json", f"card-presets/{item_id}.json"]
              elif item_type == "theme":
                  expected_paths = [f"themes/{item_id}.json"]
              else:
                  expected_paths = []

              if expected_paths and not any(os.path.isfile(path) for path in expected_paths):
                  print(
                      f"ERROR: registry entry '{item_id}' ({item_type}) has no matching file in "
                      f"{', '.join(expected_paths)}"
                  )
                  errors += 1
              elif expected_paths:
                  print(f"OK: registry entry '{item_id}' has matching file")

              url = item.get("downloadUrl", "")
              if url:
                  match = re.search(r"/main/(.+)$", url)
                  if match and not os.path.isfile(match.group(1)):
                      print(
                          f"ERROR: registry entry '{item_id}' downloadUrl path "
                          f"'{match.group(1)}' does not match any file"
                      )
                      errors += 1

          if errors > 0:
              print(f"\n{errors} error(s) found")
              sys.exit(1)

          print(f"Checked {len(registry_entries)} registry entries, {len(seen_ids)} unique IDs")
          print("\nAll validations passed")
          SCRIPT
