[pytest]
# Configuration for scripts/validate-marketplace.py unit tests.
#
# Rooted at repo root so contributors and CI can run the full suite with
# a bare `pytest` invocation (no CWD juggling, no PYTHONPATH tweaks). The
# tests use importlib to load the hyphenated `validate-marketplace.py`
# module, so no path munging is required beyond a stable rootdir.
#
# See tracking issue #461 for wiring this into GitHub Actions.
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
